  function b64toBytes(b64){const bin=atob(b64),out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out;}
  async function decryptAndRender(){
    try {
      $status.textContent='Importing key...';
      const cryptoKey=await crypto.subtle.importKey('raw',b64toBytes(KEY_B64),{name:'AES-GCM',length:256},false,['decrypt']);
      $status.textContent='Decrypting content...';
      const plainBuf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64toBytes(IV_B64)},cryptoKey,b64toBytes(CT_B64));
      $status.textContent='Rendering document...';
      const decoded=new TextDecoder('utf-8').decode(plainBuf);
      await new Promise(r=>setTimeout(r,150));
      document.open();document.write(decoded);document.close();
    } catch(err) {
      $spinner.style.display='none';
      $status.innerHTML='<span class="error">⚠ Decryption failed</span><br><span style="font-size:11px;">'+(err.message||err)+'</span>';
      console.error('Decryption failed:',err);
    }
  }
  setTimeout(decryptAndRender,60);
